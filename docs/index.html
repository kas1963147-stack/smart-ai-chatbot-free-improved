<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarksol – Quark AgentFlow AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .logo { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
        .tagline { color: #888; font-size: 1.1rem; margin-bottom: 48px; text-align: center; }
        .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 28px 36px; text-align: center; text-decoration: none; color: inherit; transition: border-color 0.2s; min-width: 180px; }
        .card:hover { border-color: #6366f1; }
        .card-icon { font-size: 2rem; margin-bottom: 10px; }
        .card-title { font-weight: 600; font-size: 1rem; color: #fff; }
        .card-sub { font-size: 0.8rem; color: #666; margin-top: 4px; }
        footer { margin-top: 60px; color: #444; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="logo">Quarksol</div>
    <p class="tagline">Quark AgentFlow AI – Multi-Agent Chatbot & Automated Workflows</p>

    <div class="cards">
        <a class="card" href="terms.html">
            <div class="card-icon">📄</div>
            <div class="card-title">Terms of Service</div>
            <div class="card-sub">quarksol.org/terms</div>
        </a>
        <a class="card" href="privacy.html">
            <div class="card-icon">🔒</div>
            <div class="card-title">Privacy Policy</div>
            <div class="card-sub">quarksol.org/privacy</div>
        </a>
    </div>

    <footer>&copy; 2026 Quarksol. All rights reserved.</footer>
</body>
</html>
